name: Build Docker image

on:
  push:
    branches: [master, updates]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Set to 'true' to start publishing to GHCR. While 'false' the workflow only
  # verifies that the image builds, and publishes nothing.
  PUBLISH: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # deepPhosAPI is a submodule; the runtime stage COPYs it into the image.
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Skipped for pull requests from forks, which get a read-only token.
        if: env.PUBLISH == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          # Pull requests build to verify the Dockerfile, but never publish.
          push: ${{ env.PUBLISH == 'true' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Image built"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [ "${{ env.PUBLISH }}" != "true" ]; then
              echo "_PUBLISH is off: image built for verification only, nothing pushed._"
            elif [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "_Pull request: built for verification only, nothing pushed._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
